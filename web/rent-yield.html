<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metrik - Rent yield</title>
  <meta name="description" content="Gross rent yield by Prishtina neighborhood where rent and sale samples are sufficient." />
  <meta property="og:title" content="Metrik - Rent yield" />
  <meta property="og:description" content="Neighborhood gross rental yield from median rent and sale prices." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v=55" />
</head>
<body data-page-title="rent_yield_title">
  <div class="page page-wide">
    <div id="site-nav"></div>
    <div id="insights-subnav"></div>

    <header class="compare-header">
      <h1 class="hero-title" data-i18n="rent_yield_title"></h1>
      <p class="hero-sub" data-i18n="rent_yield_sub"></p>
      <p class="hint hint-info" data-i18n="rent_yield_hint" data-info-attach=".compare-header .hero-title"></p>
    </header>
    <main id="main-content">

    <section class="panel" id="yield-chart-section" hidden>
      <h2 class="section-title section-title-sm" data-i18n="rent_yield_chart_title"></h2>
      <p class="hint" data-i18n="rent_yield_chart_hint"></p>
      <p class="chart-sample-note" id="yield-chart-note"></p>
      <div class="chart-container chart-container--md" id="yield-chart-wrap">
        <canvas id="yieldRankChart"></canvas>
        <p class="chart-empty-msg hint" hidden></p>
      </div>
      <button type="button" class="btn-secondary btn-compact" id="yield-chart-toggle" hidden></button>
    </section>

    <section class="panel">
      <div id="yield-status" class="hint" hidden></div>
      <p id="yield-retry-wrap" class="hidden"><button type="button" class="btn-secondary" id="yield-retry" data-i18n="retry"></button></p>
      <div class="table-wrap">
        <table class="data-table" id="yield-table">
          <thead>
            <tr>
              <th data-i18n="neighborhood"></th>
              <th data-i18n="rent_yield_col_yield"></th>
              <th data-i18n="pulse_median_rent"></th>
              <th data-i18n="pulse_median_sale"></th>
              <th data-i18n="rent_yield_col_rent_n"></th>
              <th data-i18n="rent_yield_col_sale_n"></th>
            </tr>
          </thead>
          <tbody id="yield-body" aria-busy="true">
            <tr class="skel-row" aria-hidden="true"><td colspan="6"><span class="skel-line skel-line--md"></span></td></tr>
            <tr class="skel-row" aria-hidden="true"><td colspan="6"><span class="skel-line skel-line--sm"></span></td></tr>
            <tr class="skel-row" aria-hidden="true"><td colspan="6"><span class="skel-line skel-line--md"></span></td></tr>
            <tr class="skel-row" aria-hidden="true"><td colspan="6"><span class="skel-line skel-line--sm"></span></td></tr>
            <tr class="skel-row" aria-hidden="true"><td colspan="6"><span class="skel-line skel-line--md"></span></td></tr>
            <tr class="sr-only"><td colspan="6" data-i18n="loading"></td></tr>
          </tbody>
        </table>
      </div>
    </section>

    
    </main>
    <div id="site-footer"></div>
  </div>

  <script defer src="/static/i18n.js?v=51"></script>
  <script defer src="/static/api-cache.js?v=1"></script>
  <script defer src="/static/format.js?v=10"></script>
  <script defer src="/static/theme.js?v=1"></script>
  <script defer src="/static/charts.js?v=4"></script>
  <script defer src="/static/site.js?v=34"></script>
  <script defer src="/static/rent-yield.js?v=6"></script>
</body>
</html>
