# Phase5 market semantics; legacy scalar tree compatibility retained
# Levels: city → neighborhood → district | complex (direct)
# Review: docs/LOCATION_TREE_DRAFT.md

version: phase5-market-1
updated: "2026-10-26"

resolution:
  order: [city, neighborhood, district, complex]
  rules:
    vague_nh_only:
      description: "If text only says broad NH name (Mati, Matiqan, Bregu) with no district cue → stop at neighborhood stats."
      examples: ["Mati", "te Mati", "Bregu i Diellit", "Bregu"]
    street_complex_parents:
      description: "ONLY these districts may parent complexes. All other complexes sit directly under the neighborhood."
      slugs: [rruga-b, rruga-c]
    ambiguous_complex:
      - name: Narteli
        slug: narteli
        valid_parents: [emshir, pejton-lakrishte]
        on_ambiguous: invalid_location
        note: "Do not guess — flag invalid rather than dirty stats"
      - name: Beni Dona
        slug: beni-dona
        valid_parents: [ulpiana, pejton-lakrishte]
        on_ambiguous: invalid_location
        note: "Ulpiana (beni-dona) vs Pejton/Lakrishte (benidona) — require parent NH in text"
    no_cross_district:
      - "Royal City (Spitali) ≠ Royal Mall (Rruga B)"
      - "Royal alone insufficient for Rruga B — need Royal Mall or Rruga B context"
  examples:
    - text: "Mati"
      result: { neighborhood: matiqan }
    - text: "Rruga B"
      result: { neighborhood: matiqan, district: rruga-b }
    - text: "Banesë në kompleksin Royal Mall"
      result: { neighborhood: matiqan, district: rruga-b, complex: royal-mall }
    - text: "Narteli, Emshir"
      result: { neighborhood: emshir, complex: narteli }
    - text: "Narteli"
      result: { invalid_location: true, reason: "Narteli requires Emshir or Pejton parent" }

