[project]
name = "groundtruth"
version = "0.1.0"
description = "GroundTruth — Kosovo residential real estate market intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.11",
    "scrapy-playwright>=0.0.34",
    "playwright>=1.40",
    "httpx>=0.27",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rapidfuzz>=3.6",
    "price-parser>=0.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "ftfy>=6.2",
    "rich>=13.7",
    "typer>=0.12",
    "geopy>=2.4",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "black>=24.2",
]

[project.scripts]
groundtruth = "groundtruth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]
