[project]
name = "groundtruth"
version = "0.1.0"
description = "GroundTruth — research pipeline and datasets behind Metrik (Kosovo residential market intelligence)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rapidfuzz>=3.6",
    "price-parser>=0.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "ftfy>=6.2",
    "rich>=13.7",
    "typer>=0.12",
    "orjson>=3.9",
    "brotli>=1.1",
    "pyyaml>=6.0",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "black>=24.2",
    "pip-audit>=2.7",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0",
]
research = [
    "scrapy>=2.11",
    "scrapy-playwright>=0.0.34",
    "playwright>=1.40",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "apscheduler>=3.10",
    "geopy>=2.4",
]

[project.scripts]
groundtruth = "groundtruth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "rate_limit: enable API rate limiting for security smoke tests",
    "e2e: browser-level public product tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008", # FastAPI/Typer dependency and option declarations intentionally call factories.
    "E501", # Ruff formatter owns layout; URLs and user-facing strings may remain long.
]

[tool.black]
line-length = 100
target-version = ["py312"]
