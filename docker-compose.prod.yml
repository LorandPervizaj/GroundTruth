services:
  migrate:
    profiles: ["migrate"]
    image: metrik-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      PRODUCT_WRITE_BACKEND: database
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: metrik-api:latest
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      API_DOCS_ENABLED: "false"
      PRODUCT_WRITE_BACKEND: database
      REPORTS_GENERATED_DIR: /app/reports/generated
      # Prefer false once migrations run via: docker compose --profile migrate run --rm migrate
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
    volumes:
      - ./reports/generated:/app/reports/generated:ro
      - ./data/api:/app/data/api:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Bind to all interfaces when nginx is the public edge. Restrict via host firewall if needed.
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/metrik-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./web/static:/var/www/metrik/static:ro

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-groundtruth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:-groundtruth}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
