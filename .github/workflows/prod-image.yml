# Build and scan the production Metrik image (minimal CD building block).
# Manual deploy to a VPS remains acceptable for limited beta.
# Full public launch should tag by digest and record the deploy SHA.

name: Production image

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "web/**"
      - "alembic/**"
      - "scripts/docker-entrypoint.sh"
      - ".github/workflows/prod-image.yml"

jobs:
  build-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Ensure lookup_cache path for Docker COPY
        run: mkdir -p reports/generated/lookup_cache

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: metrik-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm research tooling is absent
        run: |
          docker run --rm --entrypoint uv metrik-api:ci run python -c \
            "import importlib.util as u; assert u.find_spec('scrapy') is None; assert u.find_spec('playwright') is None; assert u.find_spec('fastapi') is not None"

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: metrik-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
