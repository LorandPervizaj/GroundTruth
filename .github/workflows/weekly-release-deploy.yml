# Deploy one exact, already-verified GroundTruth GitHub Release to public Metrik.
# Called by groundtruth-weekly-local.yml after publication, or dispatched by hand
# with an exact tag for redeploys. It never searches for a "latest" release and
# has no schedule of its own.

name: Deploy verified weekly release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact tag, groundtruth-release-<release_id>
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact tag, groundtruth-release-<release_id>
        required: true
        type: string

concurrency:
  group: metrik-weekly-release-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-beta
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RESOURCE_GROUP: ${{ vars.METRIK_AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.METRIK_AZURE_CONTAINER_APP }}
      ACR_NAME: ${{ vars.METRIK_AZURE_ACR_NAME }}
    steps:
      - name: Validate exact release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^groundtruth-release-[0-9A-Za-z][0-9A-Za-z._-]{0,99}$ ]]
          echo "RELEASE_ID=${RELEASE_TAG#groundtruth-release-}" >> "$GITHUB_ENV"
          echo "BUNDLE_NAME=$RELEASE_TAG.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - name: Download exact GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' "$BUNDLE_NAME" "$BUNDLE_NAME.sha256" | sort)"
          test "$assets" = "$expected"
          mkdir -p /tmp/release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/release-assets

      - name: Verify bundle SHA256
        run: |
          set -euo pipefail
          cd /tmp/release-assets
          sha256sum --check --strict "$BUNDLE_NAME.sha256"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install serving environment
        run: |
          uv python install 3.13
          uv sync --extra web --frozen --no-dev

      - name: Verify bundle contents and identity
        run: uv run groundtruth release verify-bundle "/tmp/release-assets/$BUNDLE_NAME" --release-id "$RELEASE_ID"

      - name: Install verified artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          tar -xzf "/tmp/release-assets/$BUNDLE_NAME" -C /tmp/release
          rm -rf reports/generated/lookup_cache
          cp -a /tmp/release/lookup_cache reports/generated/lookup_cache
          cp /tmp/release/data/api/annual_report.json data/api/annual_report.json
          cp /tmp/release/data/api/rent_yield.json data/api/rent_yield.json

      - name: Verify release again at deploy boundary
        run: uv run groundtruth release verify-artifacts

      - name: Telegram deployment started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          text="🚀 Metrik deployment started
          Release: $RELEASE_ID
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS --retry 2 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" >/dev/null

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: docker/setup-buildx-action@v3

      - name: Build immutable serving image
        run: |
          set -euo pipefail
          login="$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)"
          sha="$(git rev-parse --short HEAD)"
          image="$login/metrik-api:${RELEASE_ID}-${sha}"
          docker build -f Dockerfile -t "$image" --load .
          docker run --rm --entrypoint uv "$image" run python -c \
            "import importlib.util as u; assert u.find_spec('scrapy') is None; assert u.find_spec('playwright') is None; assert u.find_spec('fastapi') is not None"
          echo "CANDIDATE_IMAGE=$image" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=${RELEASE_ID}-${sha}" >> "$GITHUB_ENV"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push immutable serving image
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          docker push "$CANDIDATE_IMAGE"
          digest="$(az acr repository show --name "$ACR_NAME" --image "metrik-api:$CANDIDATE_TAG" --query digest -o tsv)"
          test -n "$digest"
          echo "CANDIDATE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Capture current production target
        run: |
          set -euo pipefail
          previous_image="$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query 'properties.template.containers[?name==`metrik-api`].image | [0]' -o tsv)"
          previous_revision="$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query properties.latestReadyRevisionName -o tsv)"
          test -n "$previous_image"
          echo "PREVIOUS_IMAGE=$previous_image" >> "$GITHUB_ENV"
          echo "PREVIOUS_REVISION=$previous_revision" >> "$GITHUB_ENV"

      - name: Deploy candidate revision
        run: |
          set -euo pipefail
          echo "DEPLOY_STARTED=true" >> "$GITHUB_ENV"
          az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --container-name metrik-api --image "$CANDIDATE_IMAGE"
          fqdn="$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "APP_URL=https://$fqdn" >> "$GITHUB_ENV"

      - name: Verify live production contract
        shell: pwsh
        run: ./scripts/azure/smoke.ps1 -BaseUrl $env:APP_URL -ExpectedReleaseId $env:RELEASE_ID

      - name: Record deployed revision
        run: |
          revision="$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query properties.latestReadyRevisionName -o tsv)"
          echo "DEPLOYED_REVISION=$revision" >> "$GITHUB_ENV"
          printf '%s\n' \
            "release_tag=$RELEASE_TAG" \
            "release_id=$RELEASE_ID" \
            "bundle=$BUNDLE_NAME" \
            "bundle_sha256=$(cut -d' ' -f1 "/tmp/release-assets/$BUNDLE_NAME.sha256")" \
            "image=$CANDIDATE_IMAGE" \
            "digest=$CANDIDATE_DIGEST" \
            "revision=$revision" \
            "previous_image=$PREVIOUS_IMAGE" \
            "previous_revision=$PREVIOUS_REVISION" | tee deployment-summary.txt

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ env.RELEASE_ID }}
          path: deployment-summary.txt
          retention-days: 90

      - name: Restore previous production image after failure
        if: ${{ failure() && env.DEPLOY_STARTED == 'true' && env.PREVIOUS_IMAGE != '' }}
        run: |
          set -euo pipefail
          az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --container-name metrik-api --image "$PREVIOUS_IMAGE"
          echo "ROLLBACK_ATTEMPTED=true" >> "$GITHUB_ENV"

      - name: Verify rollback
        if: ${{ failure() && env.ROLLBACK_ATTEMPTED == 'true' }}
        shell: pwsh
        run: ./scripts/azure/smoke.ps1 -BaseUrl $env:APP_URL

      - name: Telegram success notification
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          text="✅ Metrik deployment SUCCESS
          Release: $RELEASE_ID
          Image: $CANDIDATE_IMAGE
          Digest: $CANDIDATE_DIGEST
          Revision: $DEPLOYED_REVISION
          Production verification: passed"
          curl -fsS --retry 2 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" >/dev/null

      - name: Telegram failure notification
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          text="❌ Metrik deployment FAILURE
          Release: ${RELEASE_ID:-unknown}
          Candidate: ${CANDIDATE_IMAGE:-not built}
          Previous image: ${PREVIOUS_IMAGE:-unchanged}
          Rollback attempted: ${ROLLBACK_ATTEMPTED:-false}
          Previous production should be checked immediately.
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS --retry 2 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" >/dev/null
