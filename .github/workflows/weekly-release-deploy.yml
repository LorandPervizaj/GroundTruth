name: Deploy verified weekly release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      tooling_source_sha:
        required: true
        type: string
      tooling_tree_sha:
        required: true
        type: string
      serving_source_sha:
        required: true
        type: string
      serving_tree_sha:
        required: true
        type: string
      expected_state:
        required: true
        type: string
      approve_deployment:
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      tooling_source_sha:
        required: true
        type: string
      tooling_tree_sha:
        required: true
        type: string
      serving_source_sha:
        required: true
        type: string
      serving_tree_sha:
        required: true
        type: string
      expected_state:
        required: true
        type: string
      approve_deployment:
        required: true
        type: boolean
# One lock for every app writer, including callers of this reusable workflow.
concurrency:
  group: metrik-ca-metrik-api-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.approve_deployment && vars.METRIK_DEPLOY_ENABLED == 'true' && vars.METRIK_OPERATOR_WINDOW == 'exclusive' }}
    runs-on: ubuntu-latest
    environment: azure-beta
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      TOOLING_SOURCE_SHA: ${{ inputs.tooling_source_sha }}
      TOOLING_TREE_SHA: ${{ inputs.tooling_tree_sha }}
      RUNNING_TOOLING_SHA: ${{ github.workflow_sha }}
      SERVING_SOURCE_SHA: ${{ inputs.serving_source_sha }}
      SERVING_TREE_SHA: ${{ inputs.serving_tree_sha }}
      EXPECTED_STATE: ${{ inputs.expected_state }}
      GH_TOKEN: ${{ github.token }}
      METRIK_DEPLOY_ENABLED: ${{ vars.METRIK_ENV_DEPLOY_ENABLED }}
      METRIK_OPERATOR_WINDOW: ${{ vars.METRIK_ENV_OPERATOR_WINDOW }}
      METRIK_DEPLOY_HEALTH_TOKEN: ${{ secrets.METRIK_AZURE_HEALTH_CHECK_TOKEN }}
    steps:
      - name: Validate immutable approval inputs
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^groundtruth-release-[0-9A-Za-z][0-9A-Za-z._-]{0,99}$ ]]
          [[ "$TOOLING_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TOOLING_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RUNNING_TOOLING_SHA" = "$TOOLING_SOURCE_SHA"
          [[ "$SERVING_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVING_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_STATE" =~ ^[0-9a-f]{64}$ ]]
          test "$METRIK_DEPLOY_ENABLED" = true
          test "$METRIK_OPERATOR_WINDOW" = exclusive
          test -n "$METRIK_DEPLOY_HEALTH_TOKEN"
      - name: Check out reviewed deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tooling_source_sha }}
          fetch-depth: 0
          path: tools
          persist-credentials: false
      - name: Check out independent serving source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.serving_source_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Install locked validation environment
        run: |
          uv python install 3.13
          uv sync --project tools --extra web --frozen --no-dev
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/src" >> "$GITHUB_ENV"
      - name: Verify exact data bundle and independent source approval
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          python3 tools/scripts/azure/make_approval.py --source source --tools tools --assets assets --output approval.json
          uv run --project tools --no-sync python tools/scripts/azure/safe_deploy.py source --source-root source --approval approval.json --output source-verification.json
      - name: Install verified data into serving build context
        working-directory: source
        env:
          RELEASE_ASSETS_DIR: ${{ github.workspace }}/install-assets
        run: |
          uv sync --extra web --frozen --no-dev
          bash ../tools/scripts/release/install-verified-release.sh "$RELEASE_TAG"
          uv run --no-sync groundtruth release verify-artifacts
      - uses: docker/setup-buildx-action@v3
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify approved baseline before build
        run: |
          uv run --project tools --no-sync python tools/scripts/azure/safe_deploy.py inspect --output baseline.json
          python3 -c 'import json,os; assert json.load(open("baseline.json"))["fingerprint"] == os.environ["EXPECTED_STATE"]'
      - name: Build and verify reviewed serving image
        run: |
          set -euo pipefail
          LOGIN=$(az acr show -n acrmetrikbetalgy2mu --query loginServer -o tsv)
          IMAGE="$LOGIN/metrik-api:data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DATA_RELEASE_ID=$(python3 -c 'import json;print(json.load(open("approval.json"))["release_id"])')
          DATA_SOURCE_SHA=$(python3 -c 'import json;print(json.load(open("approval.json"))["data_source_sha"])')
          BUNDLE_SHA256=$(python3 -c 'import json;print(json.load(open("approval.json"))["bundle_sha256"])')
          docker build --provenance=false --label "org.opencontainers.image.revision=$SERVING_SOURCE_SHA" --label "io.metrik.data-release-id=$DATA_RELEASE_ID" --label "io.metrik.data-source-sha=$DATA_SOURCE_SHA" --label "io.metrik.bundle-sha256=$BUNDLE_SHA256" -t "$IMAGE" source
          docker run --rm --entrypoint /app/.venv/bin/groundtruth "$IMAGE" release verify-artifacts
          docker run --rm --entrypoint /app/.venv/bin/python "$IMAGE" -c "import importlib.util as u; assert u.find_spec('scrapy') is None; assert u.find_spec('playwright') is None; assert u.find_spec('azure.data.tables') is not None"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker inspect "$IMAGE" --format '{{.Id}}' > build-config-digest.txt
      - name: Trivy release gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Push and prove immutable build identity
        run: |
          set -euo pipefail
          az acr login -n acrmetrikbetalgy2mu
          docker push "$IMAGE"
          DIGEST=$(az acr repository show -n acrmetrikbetalgy2mu --image "${IMAGE#*/}" --query digest -o tsv)
          IMMUTABLE="${IMAGE%:*}@$DIGEST"
          docker buildx imagetools inspect "$IMMUTABLE" --raw > image-manifest.json
          python3 -c 'import json; assert json.load(open("image-manifest.json"))["config"]["digest"] == open("build-config-digest.txt").read().strip()'
          echo "CANDIDATE_IMAGE_DIGEST=$IMMUTABLE" >> "$GITHUB_ENV"
      - name: Capture deploy validate promote and verify with guarded rollback
        run: |
          uv run --project tools --no-sync python tools/scripts/azure/safe_deploy.py apply --approval approval.json --image "$CANDIDATE_IMAGE_DIGEST" --revision "ca-metrik-api--pub-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output deployment-receipt.json
      - name: Retain deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            approval.json
            source-verification.json
            baseline.json
            build-config-digest.txt
            image-manifest.json
            deployment-receipt.json
          retention-days: 90
