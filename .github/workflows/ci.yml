name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: groundtruth
          POSTGRES_PASSWORD: groundtruth_dev_password
          POSTGRES_DB: groundtruth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundtruth -d groundtruth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://groundtruth:groundtruth_dev_password@localhost:5432/groundtruth

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Parser regression + CI gates
        run: uv run pytest tests/test_parser_ci_gates.py tests/test_neighborhood_extraction.py tests/test_price_regression.py tests/test_parser_kpis.py -q

      - name: Full test suite
        run: uv run pytest -q
