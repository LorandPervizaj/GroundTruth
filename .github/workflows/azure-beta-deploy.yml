# All production mutations delegate to the single reviewed deployment writer.
# Ordinary source pushes NEVER publish or deploy.
name: Azure beta deploy
on:
  workflow_dispatch:
    inputs:
      data_release_tag:
        required: true
        type: string
      tooling_source_sha:
        required: true
        type: string
      tooling_tree_sha:
        required: true
        type: string
      serving_source_sha:
        required: true
        type: string
      serving_tree_sha:
        required: true
        type: string
      expected_state:
        required: true
        type: string
      approve_deployment:
        type: boolean
        default: false
jobs:
  deploy:
    if: ${{ inputs.approve_deployment && vars.METRIK_DEPLOY_ENABLED == 'true' && vars.METRIK_OPERATOR_WINDOW == 'exclusive' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/weekly-release-deploy.yml
    with:
      release_tag: ${{ inputs.data_release_tag }}
      tooling_source_sha: ${{ inputs.tooling_source_sha }}
      tooling_tree_sha: ${{ inputs.tooling_tree_sha }}
      serving_source_sha: ${{ inputs.serving_source_sha }}
      serving_tree_sha: ${{ inputs.serving_tree_sha }}
      expected_state: ${{ inputs.expected_state }}
      approve_deployment: ${{ inputs.approve_deployment }}
    secrets: inherit
