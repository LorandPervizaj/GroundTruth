# Production nginx: TLS termination, HTTP→HTTPS redirect, rate limits.
# Mount as default.conf in docker-compose.prod.yml. Place certs under deploy/nginx/certs/.

limit_req_zone $binary_remote_addr zone=api_write:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_read:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_ops:10m rate=30r/m;
limit_req_status 429;

upstream metrik_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 64k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /static/ {
        alias /var/www/metrik/static/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location = /api/health/perf {
        deny all;
        return 404;
    }

    location = /api/metrics {
        deny all;
        return 404;
    }

    location ^~ /api/analytics/ {
        deny all;
        return 404;
    }

    location ~ ^/api/(feedback|alerts|events|valuate|budget-match|lang|contact|public-report|listing-submissions|reports/annual_data/refresh) {
        limit_req zone=api_write burst=10 nodelay;
        proxy_pass http://metrik_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/ready {
        limit_req zone=api_ops burst=20 nodelay;
        proxy_pass http://metrik_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_read burst=60 nodelay;
        proxy_pass http://metrik_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://metrik_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
